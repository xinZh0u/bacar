<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi 配置 - ESP32-S3</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

  <header>
    <h1>WiFi 配置</h1>
    <p class="status">当前状态：<!--WIFI_STATUS--></p>
  </header>

  <main>

    <p class="notice"><!--MESSAGE--></p>

    <section>
      <h2>添加网络</h2>
      <form action="/wifi/save" method="post">

        <div class="field">
          <label for="ssid">网络名称（SSID）</label>
          <input type="text"
                 id="ssid"
                 name="ssid"
                 maxlength="32"
                 autocomplete="off"
                 autocapitalize="none"
                 spellcheck="false"
                 required>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <input type="password"
                 id="password"
                 name="password"
                 maxlength="64"
                 autocomplete="current-password">
          <p class="hint">留空表示连接开放网络。</p>
        </div>

        <div class="field">
          <label for="priority">优先级（0-9）</label>
          <input type="number"
                 id="priority"
                 name="priority"
                 min="0"
                 max="9"
                 placeholder="默认最高 9">
          <p class="hint">数字越大越优先。留空时新网络默认为最高优先级 9，已有网络保持原值。</p>
        </div>

        <button type="submit">保存并连接</button>

      </form>
    </section>

    <hr>

    <section>
      <h2>已保存的网络</h2>
      <p class="hint">自动连接时先比较优先级，优先级相同时选择信号更强的网络。</p>
      <ul class="network-list">
<!--NETWORK_LIST-->
      </ul>
    </section>

    <hr>

    <section>
      <h2>配置热点</h2>
      <p class="hint">修改 ESP32 自身热点的名称和密码，保存后热点会自动重启。</p>
      <form action="/wifi/ap" method="post">

        <div class="field">
          <label for="ap_ssid">热点名称（SSID）</label>
          <input type="text"
                 id="ap_ssid"
                 name="ap_ssid"
                 maxlength="32"
                 autocomplete="off"
                 autocapitalize="none"
                 spellcheck="false"
                 value="<!--AP_SSID-->"
                 required>
        </div>

        <div class="field">
          <label for="ap_password">热点密码</label>
          <input type="password"
                 id="ap_password"
                 name="ap_password"
                 maxlength="63"
                 autocomplete="new-password"
                 placeholder="留空保持当前密码">
          <p class="hint">留空保持当前密码；设置密码时至少 8 位。</p>
        </div>

        <div class="field">
          <label class="checkbox">
            <input type="checkbox" name="open" value="1">
            不设密码（开放热点）
          </label>
        </div>

        <button type="submit">保存热点设置</button>

      </form>
      <p class="hint">保存后热点会重启，已连接的设备需要重新连接。</p>
    </section>

    <hr>

    <nav>
      <h2>其他操作</h2>
      <ul class="actions-nav">
        <li><a href="/wifi/scan">扫描附近网络</a></li>
        <li><a href="/wifi">刷新页面</a></li>
        <li><a href="/">返回主页</a></li>
      </ul>
    </nav>

  </main>

  <footer>
    <p>ESP32-S3 配网页面</p>
  </footer>

</div>

</body>
</html>
